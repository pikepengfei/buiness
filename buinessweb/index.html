<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/svg+xml" href="/website/img/favicon.svg">
	<link rel="alternate icon" href="/favicon.ico">
	<link rel="apple-touch-icon" href="/website/img/logo-orange.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Centremix 芯联创 · 官网运营后台（CMS）">
	<title>Centremix 芯联创 · 运营后台</title>
</head>
<body>
<div id="app"></div>
<script>
	let s = document.createElement('script');
	s.src = `%VITE_IDAAS_ORIGIN%/symbol-font/iconfont.js?v=${ new Date().getTime() }`;
	document.head.appendChild(s);
</script>
<script type="module" src="/src/main.ts"></script>
<script>
	// 当 Vite 加载动态导入失败时，会触发 vite:preloadError 事件。event.payload 包含原始的导入错误信息。
	// 如果调用 event.preventDefault()，则不会抛出错误
	window.addEventListener('vite:preloadError', (event) => {
		window.location.reload(); // 例如，刷新页面
	});
</script>
</body>
</html>
