
server {
    listen       80;
    server_name  localhost;
    client_max_body_size 15M;
    #web端
    location / {
        root   /opt/website/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

    }

    #error
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

